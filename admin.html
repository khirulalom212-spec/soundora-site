<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soundora Admin Panel</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; padding:20px; }
    h1 { text-align:center; }
    table { width:100%; border-collapse: collapse; background:#fff; }
    th, td { padding:10px; border:1px solid #ddd; text-align:left; }
    th { background:#333; color:#fff; }
    button { padding:5px 10px; cursor:pointer; }
    .delete { background:red; color:#fff; border:none; }
    .clear { margin:10px 0; background:black; color:white; border:none; }
  </style>
</head>
<body>

<h1>📦 Soundora Admin Panel</h1>
<button class="clear" onclick="clearAll()">Clear All Orders</button>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Address</th>
      <th>Product</th>
      <th>Price</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="orderTable"></tbody>
</table>

<script>
  function loadOrders() {
    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    const table = document.getElementById("orderTable");
    table.innerHTML = "";

    orders.forEach((order, index) => {
      const row = `
        <tr>
          <td>${order.name}</td>
          <td>${order.phone}</td>
          <td>${order.address}</td>
          <td>${order.product}</td>
          <td>${order.price}</td>
          <td><button class="delete" onclick="deleteOrder(${index})">Delete</button></td>
        </tr>
      `;
      table.innerHTML += row;
    });
  }

  function deleteOrder(index) {
    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    orders.splice(index, 1);
    localStorage.setItem("orders", JSON.stringify(orders));
    loadOrders();
  }

  function clearAll() {
    if(confirm("Are you sure?")) {
      localStorage.removeItem("orders");
      loadOrders();
    }
  }

  loadOrders();
</script>

</body>
</html>
