<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>অর্ডার সামারি | Soundora</title>
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <div class="summary-container">
    <div class="summary-card">
      <h1>✅ আপনার অর্ডার কনফার্ম হয়েছে</h1>
      <p class="summary-subtitle">ধন্যবাদ! নিচে আপনার অর্ডারের তথ্য দেখুন।</p>

      <div class="summary-row">
  <span>পরিমাণ:</span>
  <strong id="summary-quantity">-</strong>
</div>
<div class="summary-row">
  <span>মোট মূল্য:</span>
  <strong id="summary-total">-</strong>
</div>
      <div class="summary-row"><span>পণ্য:</span><strong>Premium Wireless Airphone</strong></div>
      <div class="summary-row"><span>মূল্য:</span><strong>২৫০০ টাকা</strong></div>
      <div class="summary-row"><span>নাম:</span><strong id="summary-name">-</strong></div>
      <div class="summary-row"><span>মোবাইল:</span><strong id="summary-phone">-</strong></div>
      <div class="summary-row"><span>ডেলিভারি ঠিকানা:</span><strong id="summary-address">-</strong></div>

      <p class="summary-note">আমাদের টিম খুব দ্রুত আপনার সাথে মোবাইলে যোগাযোগ করবে।</p>
      <a class="back-link" href="./index.html">← আবার হোমে যান</a>
    </div>
  </div>

  <script>
  const UNIT_PRICE = 2500; // প্রতি পিস দাম

  const orderData = JSON.parse(localStorage.getItem('soundoraOrderSummary') || '{}');

  if (!orderData.name && !orderData.phone) {
    window.location.href = './index.html';
  }

  const qty = Number(orderData.quantity || 1);
  const total = UNIT_PRICE * qty;

  const fullAddress = [orderData.upazila, orderData.district, orderData.division, orderData.address]
    .filter(Boolean)
    .join(', ');

  document.getElementById('summary-name').textContent = orderData.name || '-';
  document.getElementById('summary-phone').textContent = orderData.phone || '-';
  document.getElementById('summary-address').textContent = fullAddress || '-';
  document.getElementById('summary-quantity').textContent = qty + ' পিস';
  document.getElementById('summary-total').textContent = total.toLocaleString('bn-BD') + ' টাকা';

  const rawQty = Number.parseInt(orderData.quantity, 10);
const qty = Number.isNaN(rawQty) ? 1 : Math.max(1, Math.min(5, rawQty));
const total = UNIT_PRICE * qty;

document.getElementById('summary-quantity').textContent = qty + ' পিস';
document.getElementById('summary-total').textContent = total.toLocaleString('bn-BD') + ' টাকা';
</script>
</body>
</html>
